# Every change reruns the code of each chapter and compares it with the
# output blocks printed in the book.
# The runner matches the machine that produced the blocks, because
# rounding changes the paths of iterative solvers on other CPUs.
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install -r requirements.txt
      - run: python check_outputs.py
